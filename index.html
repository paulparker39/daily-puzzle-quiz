<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily School Quiz</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎓 Daily School Quiz</h1>
      <p class="subtitle">5 questions. One per subject. Every day.</p>
      <div class="meta-row">
        <span id="today-date"></span>
        <span class="streak-badge">🔥 <span id="streak-count">0</span> day streak</span>
      </div>
    </header>

    <section id="name-gate" class="card">
      <label for="username-input">What's your name?</label>
      <input id="username-input" type="text" maxlength="24" placeholder="Player" />
      <button id="start-btn">Start Today's Quiz</button>
    </section>

    <form id="quiz-form" class="card hidden"></form>

    <section id="results" class="card hidden">
      <h2>Results</h2>
      <div id="breakdown"></div>
      <h3>Share your results</h3>
      <textarea id="share-text" readonly rows="10"></textarea>
      <div class="share-actions">
        <button id="copy-btn">Copy to Clipboard</button>
        <span id="copy-confirm" class="hidden">Copied!</span>
      </div>
    </section>

    <section id="already-played" class="card hidden">
      <h2>You already played today ✅</h2>
      <p>Come back tomorrow for a new set of questions.</p>
      <div id="already-breakdown"></div>
      <textarea id="already-share-text" readonly rows="10"></textarea>
      <div class="share-actions">
        <button id="already-copy-btn">Copy to Clipboard</button>
        <span id="already-copy-confirm" class="hidden">Copied!</span>
      </div>
    </section>

    <footer>
      <p>Question bank stored in <code>/questions/*.json</code> — scoring logic in <code>scoring.js</code>.</p>
    </footer>
  </div>

  <script src="scoring.js"></script>
  <script src="script.js"></script>
</body>
</html>
